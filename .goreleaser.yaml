version: 2

before:
  hooks:
    - go run ./tools/gendocs -man
    - sh -c 'mkdir -p completions && for sh in bash zsh fish; do go run ./cmd/osmctl completion $sh > completions/osmctl.$sh; done'

builds:
  - dir: ./cmd/osmctl
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    files:
      - LICENSE
      - README.md
      - docs/man/*
      - completions/*
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
