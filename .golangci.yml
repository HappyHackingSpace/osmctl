version: "2"

run:
  timeout: 5m

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - gocritic
    - misspell
    - revive
  settings:
    errcheck:
      # Output goes through tabwriters and buffers whose Flush error is returned.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      rules:
        - name: exported
          disabled: true
        - name: unexported-return
          disabled: true

formatters:
  enable:
    - gofmt
